<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}EVV Trainingen{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #16a34a;
      --green-light: #bbf7d0;
      --green-dark: #14532d;
      --red: #dc2626;
      --red-light: #fee2e2;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-900: #111827;
      --white: #ffffff;
      --shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08);
      --shadow-md: 0 4px 6px rgba(0,0,0,.1), 0 2px 4px rgba(0,0,0,.06);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--gray-100);
      color: var(--gray-900);
      min-height: 100vh;
    }

    nav {
      background: var(--green-dark);
      color: var(--white);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      height: 56px;
      box-shadow: var(--shadow-md);
    }
    nav .logo { font-weight: 700; font-size: 1.2rem; letter-spacing: .5px; }
    nav a { color: rgba(255,255,255,.8); text-decoration: none; font-size: .9rem; }
    nav a:hover { color: var(--white); }

    main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }

    h1 { font-size: 1.75rem; font-weight: 700; color: var(--gray-900); margin-bottom: 1.5rem; }
    h2 { font-size: 1.25rem; font-weight: 600; color: var(--gray-700); margin-bottom: 1rem; }

    .card {
      background: var(--white);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } }

    .btn {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .5rem 1rem; border-radius: 8px; border: none;
      font-size: .875rem; font-weight: 500; cursor: pointer;
      text-decoration: none; transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--green); color: var(--white); }
    .btn-danger  { background: var(--red);   color: var(--white); }
    .btn-ghost   { background: var(--gray-200); color: var(--gray-700); }

    input, select, textarea {
      width: 100%; padding: .5rem .75rem; border: 1px solid var(--gray-300);
      border-radius: 8px; font-size: .9rem; color: var(--gray-900);
      background: var(--white);
    }
    input:focus, textarea:focus { outline: 2px solid var(--green); outline-offset: 2px; }
    label { display: block; font-size: .8rem; font-weight: 600; color: var(--gray-600); margin-bottom: .3rem; }
    .form-group { margin-bottom: 1rem; }

    .badge {
      display: inline-block; padding: .2rem .6rem; border-radius: 999px;
      font-size: .75rem; font-weight: 600;
    }
    .badge-green { background: var(--green-light); color: var(--green-dark); }
    .badge-red   { background: var(--red-light);   color: var(--red); }
    .badge-gray  { background: var(--gray-200);     color: var(--gray-600); }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em;
         color: var(--gray-600); padding: .6rem 1rem; border-bottom: 2px solid var(--gray-200); }
    td { padding: .75rem 1rem; border-bottom: 1px solid var(--gray-100); font-size: .9rem; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--gray-50); }

    .toggle-wrap { display: flex; align-items: center; gap: .75rem; }
    .toggle { position: relative; width: 44px; height: 24px; cursor: pointer; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider {
      position: absolute; inset: 0; background: var(--gray-300);
      border-radius: 999px; transition: background .2s;
    }
    .toggle .slider::before {
      content: ""; position: absolute; height: 18px; width: 18px;
      left: 3px; top: 3px; background: var(--white); border-radius: 50%;
      transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    .toggle input:checked + .slider { background: var(--green); }
    .toggle input:checked + .slider::before { transform: translateX(20px); }

    .stat-bar { background: var(--gray-200); border-radius: 999px; height: 8px; overflow: hidden; }
    .stat-bar-fill { height: 100%; background: var(--green); border-radius: 999px; transition: width .4s; }

    .empty { text-align: center; padding: 3rem 1rem; color: var(--gray-600); }
  </style>
</head>
<body>
  <nav>
    <span class="logo">EVV Trainingen</span>
    <a href="/training/">Dashboard</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
